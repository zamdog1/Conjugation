// ---------- styles ----------
const CSS = `
:root {
  --paper: #F6F1E6;
  --paper-2: #EFE8D8;
  --ink: #1F2544;
  --ink-soft: #4A4F6B;
  --red: #A6362C;
  --blue: #35577A;
  --gold: #C79A3B;
  --line: rgba(31,37,68,0.14);
  --g-blue: #3B6FA0;
  --g-teal: #2E8B7D;
  --g-gold: #D9A227;
  --g-purple: #7B5EA7;
  --g-coral: #D96A4B;
  --g-pink: #C15B87;
  --g-green: #3F9142;
  --g-red: #C0392B;
  --g-cyan: #2AA9C4;
}
.carnet-root {
  min-height: 100%;
  background: var(--paper);
  background-image:
    radial-gradient(var(--line) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  padding-bottom: 48px;
}
.carnet-root * { box-sizing: border-box; }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 10px;
  max-width: 720px; margin: 0 auto;
}
.brand {
  display: flex; align-items: center; gap: 8px;
  font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px;
  color: var(--ink); background: none; border: none; cursor: pointer; padding: 0;
}
.back-btn {
  display: flex; align-items: center; gap: 6px;
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.03em;
  color: var(--ink-soft); background: none; border: none; cursor: pointer; padding: 6px 8px;
}
.back-btn:hover { color: var(--ink); }

.content { max-width: 720px; margin: 0 auto; padding: 8px 20px 0; }

/* Hero */
.hero { text-align: center; padding: 28px 0 12px; display: flex; flex-direction: column; align-items: center; }
.hero-title {
  font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(24px, 5vw, 32px);
  line-height: 1.25; max-width: 480px; margin: 18px 0 10px;
}
.hero-sub { color: var(--ink-soft); font-size: 14.5px; max-width: 440px; line-height: 1.55; margin: 0; }

/* Postmark signature element */
.postmark {
  position: relative; width: 84px; height: 84px; color: var(--red);
  display: flex; align-items: center; justify-content: center;
}
.postmark-sm { width: 60px; height: 60px; }
.postmark-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-8deg); }
.postmark-code {
  font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 12px;
  transform: rotate(-8deg); letter-spacing: 0.02em;
}
.postmark-sm .postmark-code { font-size: 9.5px; }
.postmark-label {
  position: absolute; bottom: 8px; font-family: 'IBM Plex Mono', monospace;
  font-size: 6px; letter-spacing: 0.14em; transform: rotate(-8deg);
}
.postmark-sm .postmark-label { display: none; }

/* Action grid */
.action-grid { display: grid; gap: 12px; margin-top: 24px; }
.action-card {
  display: flex; align-items: flex-start; gap: 14px; text-align: left;
  background: #fff; border: 1.5px solid var(--ink); border-radius: 3px;
  padding: 16px 16px; cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  color: var(--ink);
}
.action-card:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
.action-card:active { transform: translate(0,0); box-shadow: 2px 2px 0 var(--ink); }
.action-card svg { flex-shrink: 0; color: var(--red); margin-top: 2px; }
.action-card h3 { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; margin: 0 0 3px; }
.action-card p { font-size: 12.5px; color: var(--ink-soft); margin: 0; }

.recent { margin-top: 30px; }
.recent h2 { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px; }
.recent-list { display: flex; flex-direction: column; gap: 8px; }
.recent-list.wide { margin-top: 6px; }
.recent-item {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px;
  cursor: pointer; text-align: left; color: var(--ink);
}
.recent-item:hover { border-color: var(--ink); }
.recent-code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; background: var(--paper-2); padding: 3px 6px; border-radius: 2px; color: var(--blue); }
.recent-name { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-count { font-size: 11px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }

/* Section titles */
.section-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; margin: 14px 0 4px; }
.section-sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 18px; }

/* Forms */
.field-label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 18px 0 6px; }
.text-input, .text-area {
  width: 100%; background: #fff; border: 1.5px solid var(--ink); border-radius: 3px;
  padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 14.5px; color: var(--ink);
}
.text-input:focus, .text-area:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
.text-area { resize: vertical; line-height: 1.6; }
.code-paste-area { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; word-break: break-all; }
.code-box { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 6px 0; }
.code-box-textarea {
  width: 100%; max-width: 380px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; word-break: break-all;
  background: #fff; border: 1.5px solid var(--ink); border-radius: 6px; padding: 10px 12px; resize: vertical; color: var(--ink-soft);
}
.field-hint { font-size: 11.5px; color: var(--ink-soft); margin: 6px 0 0; }
.source-note { margin-top: 8px; line-height: 1.5; }

.error-line { display: flex; align-items: center; gap: 6px; color: var(--red); font-size: 13px; margin: 12px 0 0; }
.notice-line { display: flex; align-items: center; gap: 6px; color: #8A5A18; margin: 10px 0 0; }
.preview-chips { margin-top: 14px; }
.preview-label { margin-bottom: 6px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; background: #fff;
  border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; color: var(--ink);
}

.primary-btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  margin-top: 18px; background: var(--ink); color: var(--paper);
  border: none; border-radius: 3px; padding: 11px 20px; font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: 'Inter', sans-serif;
  box-shadow: 3px 3px 0 var(--gold);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.primary-btn:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--gold); }
.primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.save-btn { display: flex; width: 100%; }

.secondary-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 3px;
  padding: 8px 14px; font-size: 13px; cursor: pointer; margin-bottom: 18px;
}
.secondary-btn:disabled { opacity: 0.7; cursor: default; }

.empty-state { background: #fff; border: 1px dashed var(--ink-soft); border-radius: 4px; padding: 28px 20px; text-align: center; color: var(--ink-soft); }
.empty-state .primary-btn { margin-top: 14px; }

/* Saved panel */
.saved-panel { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 0; }
.saved-panel h2 { font-family: 'Fraunces', serif; font-size: 22px; margin: 16px 0 6px; }
.saved-panel p { color: var(--ink-soft); font-size: 14px; max-width: 380px; line-height: 1.6; }
.code-inline { font-family: 'IBM Plex Mono', monospace; color: var(--red); letter-spacing: 0.06em; }

/* Set view header */
.set-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.set-header .section-title { margin-top: 4px; }

/* Stamp cards */
.stamp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 20px; }
.stamp-card { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.stamp-frame { position: relative; border: 2px solid var(--ink); padding: 6px; background: var(--paper); overflow: hidden; }
.stamp-perf {
  position: absolute; inset: -7px; pointer-events: none; z-index: 2;
  background-image: radial-gradient(circle, var(--paper) 3px, transparent 3.6px);
  background-size: 14px 14px; background-position: -7px -7px;
}
.stamp-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; position: relative; z-index: 1; }
.stamp-img-loading {
  display: flex; align-items: center; justify-content: center;
  background: var(--paper-2); color: var(--ink-soft); aspect-ratio: 1 / 1;
}
.stamp-img-fallback {
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--gold), var(--red));
  color: #fff; font-family: 'Fraunces', serif; font-size: 34px; font-weight: 600;
}
.stamp-img-actions { position: absolute; bottom: 6px; right: 6px; z-index: 3; display: flex; gap: 5px; }
.stamp-img-action-btn {
  background: rgba(255,255,255,0.92); border: 1px solid var(--ink); border-radius: 50%;
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink);
}
.stamp-img-action-btn:disabled { opacity: 0.6; }
.stamp-your-photo {
  position: absolute; top: 6px; left: 6px; z-index: 3; font-family: 'IBM Plex Mono', monospace;
  font-size: 8.5px; letter-spacing: 0.03em; background: var(--gold); color: #fff; padding: 2px 6px; border-radius: 10px;
}
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.stamp-body { display: flex; flex-direction: column; gap: 4px; }
.stamp-word-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.stamp-word-heading { margin: 0; font-weight: normal; }
.word-btn { display: inline-flex; align-items: center; gap: 5px; background: none; border: none; padding: 0; cursor: pointer; color: var(--ink); text-align: left; }
.word-btn:hover .stamp-word { color: var(--red); }
.word-btn:hover .word-btn-icon { color: var(--red); }
.word-btn:active { opacity: 0.7; }
.stamp-word { display: inline-block; font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; transition: color 0.1s ease; }
.word-btn-icon { color: var(--ink-soft); flex-shrink: 0; transition: color 0.1s ease; }
.stamp-pos { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--blue); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
.gender-chip { display: inline-block; width: fit-content; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--red); background: #F3E4E1; padding: 1px 6px; border-radius: 3px; margin-top: 3px; letter-spacing: 0.02em; }
.stamp-translation { font-size: 13.5px; color: var(--ink-soft); margin: 4px 0 0; }
.stamp-example { border-top: 1px dashed var(--line); padding-top: 7px; margin-top: 2px; }
.stamp-example-fr { font-style: italic; font-size: 12px; margin: 0 0 2px; }
.stamp-example-en { font-size: 11px; color: var(--ink-soft); margin: 0; }
.stamp-footer { display: flex; flex-direction: column; gap: 5px; border-top: 1px dashed var(--line); padding-top: 7px; margin-top: 2px; }
.src-badge { display: inline-flex; align-items: center; gap: 4px; width: fit-content; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.03em; padding: 2px 6px; border-radius: 20px; }
.src-badge-verified { background: #E4EEE4; color: #2E6B3E; }
.src-badge-ai { background: #F5E7CE; color: #8A5A18; }
.wr-link { font-size: 10.5px; color: var(--blue); text-decoration: none; }
.wr-link:hover { text-decoration: underline; }

.share-footer { display: flex; align-items: center; gap: 7px; justify-content: center; margin-top: 26px; color: var(--ink-soft); font-size: 12.5px; }

.set-action-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 6px; }
.play-games-btn { margin-top: 0; }

@media (min-width: 560px) {
  .action-grid { grid-template-columns: 1fr; }
}

/* =========================================================
   GAMES ARCADE
   ========================================================= */

.arcade-header { margin-bottom: 6px; }
.arcade-title { display: flex; align-items: center; gap: 10px; }
.arcade-section { margin-top: 26px; }
.arcade-cat-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 10px; font-weight: 500;
}
.arcade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

.game-ticket {
  position: relative; text-align: left; background: #fff; border: 1.5px solid var(--ink);
  border-radius: 6px; padding: 16px 14px 14px; cursor: pointer; overflow: hidden;
  box-shadow: 3px 3px 0 var(--cat-color, var(--ink));
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  display: flex; flex-direction: column; gap: 6px;
}
.game-ticket::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--cat-color, var(--ink));
}
.game-ticket:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--cat-color, var(--ink)); }
.game-ticket:active:not(:disabled) { transform: translate(0,0); box-shadow: 2px 2px 0 var(--cat-color, var(--ink)); }
.game-ticket:disabled { opacity: 0.55; cursor: not-allowed; }
.ticket-perf {
  position: absolute; top: 4px; right: -6px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--paper); border: 1.5px solid var(--ink);
}
.ticket-icon { color: var(--cat-color, var(--ink)); margin-bottom: 2px; }
.ticket-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14.5px; margin: 0; line-height: 1.25; }
.ticket-tagline { font-size: 11.5px; color: var(--ink-soft); margin: 0; line-height: 1.4; }
.ticket-stars { display: flex; gap: 2px; color: var(--gold); margin-top: 2px; }

/* Shared game shell */
.game-play-wrap { padding-bottom: 20px; }
.game-header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.game-title-inline { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; margin: 0; }
.game-shell { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 6px 0 24px; }
.game-empty { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--ink-soft); text-align: center; padding: 40px 20px; }

.game-progress-row { width: 100%; display: flex; align-items: center; gap: 10px; }
.game-progress-track { flex: 1; height: 7px; background: var(--paper-2); border-radius: 20px; overflow: hidden; }
.game-progress-fill { height: 100%; background: var(--ink); border-radius: 20px; transition: width 0.3s ease; }
.game-progress-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
.game-score-label { display: flex; align-items: center; gap: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gold); white-space: nowrap; }
.game-streak { display: flex; align-items: center; gap: 3px; color: var(--g-coral); font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; }
.flame-icon { animation: flame-pulse 0.6s ease-in-out infinite alternate; }
@keyframes flame-pulse { from { transform: scale(1); } to { transform: scale(1.18); } }

.word-speak-btn {
  display: inline-flex; align-items: center; gap: 6px; background: var(--paper-2); border: 1px solid var(--line);
  color: var(--ink); border-radius: 20px; padding: 6px 12px; cursor: pointer; font-size: 12.5px;
}
.word-speak-btn:hover { background: #fff; border-color: var(--ink); }
.center-btn { margin: 4px auto 0; }

.shake-wrong { animation: shake 0.4s; }
.shake-correct { animation: pop 0.3s; }
@keyframes shake {
  10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); }
  30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); }
}
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

/* Confetti */
.confetti-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 50; }
.confetti-piece { position: absolute; top: -12px; width: 8px; height: 14px; opacity: 0.9; border-radius: 2px; animation-name: confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards; }
@keyframes confetti-fall { to { transform: translate(var(--drift), 100vh) rotate(360deg); opacity: 0; } }

/* Results screen */
.results-screen { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 40px 20px; position: relative; }
.results-trophy { color: var(--gold); }
.results-stars { display: flex; gap: 6px; margin: 4px 0; }
.result-star { color: var(--ink-soft); opacity: 0; animation: star-pop 0.4s ease forwards; }
.result-star.lit { color: var(--gold); }
@keyframes star-pop { 0% { opacity: 0; transform: scale(0.3) rotate(-15deg); } 70% { transform: scale(1.15) rotate(5deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.results-score { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin: 0; }
.results-message { color: var(--ink-soft); font-size: 14px; margin: 0; }
.results-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.ghost-btn { background: none; border: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; padding: 10px 8px; text-decoration: underline; }

/* MCQ */
.mcq-shell { width: 100%; max-width: 480px; }
.mcq-top-row { width: 100%; display: flex; align-items: center; gap: 10px; }
.mcq-timer { display: flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.mcq-timer.urgent { color: var(--g-red); font-weight: 600; }
.mcq-prompt-card { width: 100%; background: #fff; border: 1.5px solid var(--ink); border-radius: 8px; padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.mcq-prompt-text { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; margin: 0; }
.mcq-prompt-img { max-width: 100%; max-height: 200px; border-radius: 6px; object-fit: cover; }
.mcq-options { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcq-options-image { grid-template-columns: 1fr 1fr; }
.mcq-text-opt {
  background: #fff; border: 1.5px solid var(--line); border-radius: 8px; padding: 14px 10px; font-size: 14px;
  cursor: pointer; color: var(--ink); transition: border-color 0.12s, transform 0.1s;
}
.mcq-text-opt:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-1px); }
.mcq-image-opt { border: 1.5px solid var(--line); border-radius: 8px; padding: 4px; cursor: pointer; background: #fff; overflow: hidden; }
.mcq-image-opt img { width: 100%; height: 90px; object-fit: cover; border-radius: 4px; display: block; }
.opt-correct { border-color: var(--g-green) !important; background: #E7F4E8 !important; }
.opt-wrong { border-color: var(--g-red) !important; background: #FBEAE8 !important; }

/* True/False */
.tf-shell { width: 100%; max-width: 420px; }
.tf-card { width: 100%; background: #fff; border: 1.5px solid var(--ink); border-radius: 8px; padding: 28px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.tf-word { font-family: 'Fraunces', serif; font-size: 22px; margin: 4px 0 0; }
.tf-arrow { font-size: 12px; color: var(--ink-soft); margin: 0; }
.tf-meaning { font-size: 18px; font-weight: 600; margin: 0; }
.tf-buttons { display: flex; gap: 14px; width: 100%; }
.tf-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px; border-radius: 8px; border: 1.5px solid var(--ink); cursor: pointer; font-size: 14px; font-weight: 500; }
.tf-false { background: #fff; color: var(--g-red); }
.tf-true { background: #fff; color: var(--g-green); }
.tf-false:hover, .tf-true:hover { transform: translateY(-1px); }

/* Odd one out */
.oddoneout-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 420px; }
.oddoneout-opt { text-align: center; }

/* Memory */
.memory-shell { max-width: 480px; width: 100%; }
.memory-moves { font-size: 12.5px; color: var(--ink-soft); margin: 0; }
.memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; perspective: 800px; }
.memory-card { aspect-ratio: 1; background: none; border: none; padding: 0; cursor: pointer; }
.memory-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.4s; transform-style: preserve-3d; }
.memory-card.is-flipped .memory-card-inner { transform: rotateY(180deg); }
.memory-card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 6px; border: 1.5px solid var(--ink); display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px; }
.memory-card-back { background: var(--ink); color: var(--paper); font-family: 'Fraunces', serif; font-size: 20px; }
.memory-card-front { background: #fff; transform: rotateY(180deg); font-size: 11px; text-align: center; word-break: break-word; }
.memory-card-front img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
.memory-card.is-matched .memory-card-face { border-color: var(--g-green); opacity: 0.55; }

/* Chrono match */
.chrono-shell { width: 100%; max-width: 460px; }
.chrono-columns { display: flex; gap: 14px; width: 100%; }
.chrono-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.chrono-chip { background: #fff; border: 1.5px solid var(--line); border-radius: 20px; padding: 10px 14px; font-size: 13px; cursor: pointer; text-align: center; }
.chrono-chip.sel { border-color: var(--ink); background: var(--paper-2); }
.chrono-chip.matched { border-color: var(--g-green); background: #E7F4E8; opacity: 0.7; }
.chrono-chip.wrong { border-color: var(--g-red); background: #FBEAE8; }

/* Typing */
.typing-shell { width: 100%; max-width: 460px; }
.typing-prompt-card { width: 100%; background: #fff; border: 1.5px solid var(--ink); border-radius: 8px; padding: 24px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.typing-hint { font-size: 12px; color: var(--ink-soft); margin: 0; }
.typing-prompt { font-family: 'Fraunces', serif; font-size: 22px; margin: 0; }
.typing-sentence { font-size: 16px; line-height: 1.6; margin: 0; }
.blank-slot { display: inline-block; border-bottom: 2px solid var(--ink); min-width: 60px; }
.typing-input-row { display: flex; gap: 8px; width: 100%; }
.typing-input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--ink); font-size: 15px; font-family: 'Inter', sans-serif; }
.typing-input.fb-correct { border-color: var(--g-green); background: #E7F4E8; }
.typing-input.fb-wrong { border-color: var(--g-red); background: #FBEAE8; }
.typing-answer-reveal { font-size: 13px; color: var(--ink-soft); margin: 0; }

/* Hangman */
.hangman-shell { width: 100%; max-width: 460px; }
.hangman-figure { width: 90px; height: 100px; color: var(--ink); }
.hangman-word { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.hangman-slot { display: flex; flex-direction: column; align-items: center; width: 20px; }
.hangman-letter { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; text-transform: uppercase; height: 24px; }
.hangman-underline { width: 100%; height: 2px; background: var(--ink); }
.hangman-keyboard { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 360px; }
.hangman-key { width: 30px; height: 34px; border-radius: 5px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; text-transform: uppercase; }
.hangman-key:disabled { cursor: default; }
.key-right { background: #E7F4E8; border-color: var(--g-green); color: var(--g-green); }
.key-wrong { background: #FBEAE8; border-color: var(--g-red); color: var(--g-red); opacity: 0.7; }
.hangman-result { display: flex; flex-direction: column; align-items: center; gap: 10px; }

/* Scramble & sentence */
.scramble-shell, .sentence-shell { width: 100%; max-width: 500px; }
.scramble-hint { font-size: 13px; color: var(--ink-soft); margin: 0; text-align: center; }
.scramble-answer-row, .sentence-answer-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 44px; }
.scramble-answer-slot { width: 34px; height: 40px; border-bottom: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; text-transform: uppercase; }
.scramble-answer-tile { background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 6px; padding: 8px 12px; font-size: 14px; }
.scramble-tile-row, .sentence-tile-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.scramble-tile { width: 40px; height: 44px; border-radius: 6px; border: 1.5px solid var(--ink); background: #fff; font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; text-transform: uppercase; cursor: pointer; }
.scramble-tile.word-tile { width: auto; padding: 0 14px; font-size: 13px; font-family: 'Inter', sans-serif; text-transform: none; font-weight: 500; }
.scramble-tile.used { opacity: 0.3; pointer-events: none; }
.scramble-tile:hover:not(:disabled) { transform: translateY(-2px); }

/* Flashcards */
.flashcard-shell { width: 100%; max-width: 420px; }
.flashcard { width: 100%; height: 220px; cursor: pointer; perspective: 1000px; }
.flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
.flashcard.is-flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px; border: 1.5px solid var(--ink); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; text-align: center; }
.flashcard-face h2 { font-family: 'Fraunces', serif; font-size: 24px; margin: 0; }
.flashcard-back { transform: rotateY(180deg); background: var(--paper-2); }
.flashcard-hint { font-size: 12px; color: var(--ink-soft); }
.flashcard-example { font-size: 13px; font-style: italic; color: var(--ink-soft); margin: 0; }
.flashcard-rate-row { display: flex; gap: 12px; width: 100%; }

/* Listen & repeat */
.listen-shell { width: 100%; max-width: 400px; }
.listen-card { display: flex; flex-direction: column; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--ink); border-radius: 10px; padding: 30px 20px; width: 100%; }
.listen-big-btn { width: 76px; height: 76px; border-radius: 50%; background: var(--ink); color: var(--paper); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.listen-word { font-family: 'Fraunces', serif; font-size: 22px; margin: 6px 0 0; }
.listen-translation { color: var(--ink-soft); margin: 0; }

/* Bingo */
.bingo-shell { width: 100%; max-width: 400px; }
.bingo-draw-area { display: flex; gap: 10px; align-items: center; }
.bingo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.bingo-cell { aspect-ratio: 1; background: #fff; border: 1.5px solid var(--line); border-radius: 8px; font-size: 11.5px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; }
.bingo-cell.marked { background: var(--g-gold); color: #fff; border-color: var(--g-gold); }
.bingo-progress { font-size: 12.5px; color: var(--ink-soft); margin: 0; }

/* Gender sort */
.gender-shell { width: 100%; max-width: 400px; }
.gender-card { width: 100%; background: #fff; border: 1.5px solid var(--ink); border-radius: 10px; padding: 30px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.gender-word { font-family: 'Fraunces', serif; font-size: 24px; margin: 4px 0 0; }
.gender-translation { color: var(--ink-soft); margin: 0; }
.gender-buttons { display: flex; gap: 12px; width: 100%; }
.gender-btn { flex: 1; padding: 16px; border-radius: 10px; border: 1.5px solid var(--ink); cursor: pointer; font-size: 14px; font-weight: 600; }
.gender-m { background: var(--g-blue); color: #fff; border-color: var(--g-blue); }
.gender-f { background: var(--g-pink); color: #fff; border-color: var(--g-pink); }

@media (max-width: 480px) {
  .mcq-options { grid-template-columns: 1fr; }
  .oddoneout-grid { grid-template-columns: 1fr; }
  .chrono-columns { gap: 8px; }
}

/* Edit carnet view */
.edit-words-label { margin-top: 24px; }
.edit-add-label { margin-top: 28px; }
.edit-save-row { margin-top: 24px; }
.edit-card-wrap { position: relative; }
.edit-remove-btn {
  position: absolute; top: -8px; right: -8px; z-index: 4;
  background: var(--red); color: #fff; border: 2px solid var(--paper); border-radius: 50%;
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.edit-remove-btn:hover { background: #8a2a22; }

/* HD canvas arcade games */
.canvas-hud { width: 100%; max-width: 320px; display: flex; align-items: center; gap: 10px; }
.canvas-lives { font-size: 14px; letter-spacing: 2px; white-space: nowrap; }
.canvas-frame { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 18px rgba(31,37,68,0.18); line-height: 0; }
.canvas-frame canvas { display: block; touch-action: none; cursor: pointer; border-radius: 14px; }
.canvas-overlay-msg {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(31,37,68,0.85); color: #fff; padding: 6px 14px; border-radius: 20px;
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
}
.canvas-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); }
.runner-lane-buttons { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 68px; }
.runner-lane-btn {
  background: rgba(255,255,255,0.92); border: 1.5px solid var(--ink); border-radius: 20px;
  padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink);
}
.runner-lane-btn:hover { background: #fff; transform: translateY(-1px); }
.catcher-shell, .target-shell, .runner-shell { align-items: center; }
`;


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(CarnetApp));
