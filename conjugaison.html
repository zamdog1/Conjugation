<style>
:root{
  --ink:#1E2A4A;
  --ink-light:#2D3F66;
  --parchment:#F7F3E9;
  --parchment-dark:#EDE6D6;
  --coral:#E94B3C;
  --coral-light:#F2786B;
  --gold:#C9A961;
  --green:#4A9B6E;
  --text-dark:#2A2A2A;
  --text-muted:#6B6B6B;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--ink);
  background-image:radial-gradient(circle at 20% 20%, var(--ink-light) 0%, var(--ink) 60%);
  color:var(--parchment);
  min-height:100vh;
  padding:24px 16px;
}
.app{max-width:680px;margin:0 auto;}
.title-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:8px;}
.title{
  font-family:Georgia,'Times New Roman',serif;
  font-size:32px;
  font-weight:700;
  letter-spacing:-0.5px;
  color:var(--parchment);
}
.title .accent{color:var(--coral-light);}
.subtitle{font-size:13px;color:rgba(247,243,233,0.6);margin-top:2px;}

.name-card{
  background:var(--parchment);
  border-radius:14px;
  padding:18px 20px;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
.name-card input{
  flex:1;
  border:none;
  border-bottom:2px solid var(--parchment-dark);
  background:transparent;
  font-size:16px;
  padding:8px 4px;
  font-family:inherit;
  color:var(--text-dark);
  outline:none;
}
.name-card input:focus{border-bottom-color:var(--coral);}
.name-card label{font-size:13px;color:var(--text-muted);white-space:nowrap;}
.name-card{flex-wrap:wrap;}
.name-card .btn{padding:10px 18px;font-size:14px;}

.gate-msg{
  font-size:13px;
  color:rgba(247,243,233,0.75);
  text-align:center;

}

.stat-pill{
  background:rgba(247,243,233,0.08);
  border:1px solid rgba(247,243,233,0.15);

.sel-btn{
  background:rgba(247,243,233,0.07);
  border:1px solid rgba(247,243,233,0.18);
  color:var(--parchment);
  padding:7px 11px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
  transition:all 0.15s;
  font-family:inherit;
  white-space:nowrap;
}
.sel-btn:hover{background:rgba(247,243,233,0.14);}
.sel-btn.active{background:var(--coral);border-color:var(--coral);color:#fff;}

.card{
  background:var(--parchment);
  border-radius:18px;
  padding:36px 28px;
  box-shadow:0 12px 32px rgba(0,0,0,0.3);

}

  content:'';

.prompt-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}

  font-family:Georgia,serif;
  font-size:24px;

}

  flex:1;
  font-size:20px;
  padding:12px 14px;

}

.feedback.wrong{color:var(--coral);}

.btn-row{display:flex;gap:10px;}
.btn{
  padding:12px 22px;
  border-radius:10px;

.btn-secondary{background:var(--parchment-dark);color:var(--text-dark);}

.leaderboard{
  background:rgba(247,243,233,0.06);
  border:1px solid rgba(247,243,233,0.14);
  border-radius:14px;
  padding:18px 20px;
  margin-top:22px;
}
.lb-title{
  font-family:Georgia,serif;
  font-size:18px;
  font-weight:700;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.lb-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 0;

}
.lb-name{flex:1;color:var(--parchment);}
.lb-score{font-weight:700;color:var(--coral-light);}

  .verb-display{font-size:28px;}

<body>
<div class="app">
  <div class="title-row">
    <div>
      <div class="title">Conjugai<span class="accent">son</span></div>

  <div class="name-card" id="nameCard">

<script>
// =====================================================================================
// LIVE LEADERBOARD — backed by Firebase (Cloud Firestore)
// =====================================================================================
// This makes the leaderboard genuinely internet-connected, with NO login required for
// students: every student, on every device, reads/writes the SAME database live.
// Uses the same Firebase project as your other apps — just a different collection
// ("conjugaison_leaderboard") so nothing collides with existing data.
// =====================================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyByaWorFmYHKlSG0TEFBxSfZAkKh3AFc8k",
  authDomain: "frenchverbgame.firebaseapp.com",
  projectId: "frenchverbgame",
  storageBucket: "frenchverbgame.firebasestorage.app",
  messagingSenderId: "686776661432",
  appId: "1:686776661432:web:cbd6b224d64c5c5ff00b4d"
};
const FIRESTORE_COLLECTION = 'conjugaison_leaderboard';

function fbEncodeKey(k){ return encodeURIComponent(k).replace(/\./g, '%2E'); }
function fbDecodeKey(k){ return decodeURIComponent(k.replace(/%2E/g, '.')); }

let storageBackend = 'local'; // 'firebase' (shared, no login) | 'native' (Claude session) | 'local' (this device only)

(function ensureStorage(){
  // 1) Preferred: Firebase Firestore. Fully shared, no student login required.
  if (FIREBASE_CONFIG.projectId && window.firebase) {
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      const db = firebase.firestore();
      storageBackend = 'firebase';
      window.storage = {
        async get(key, shared){
          const snap = await db.collection(FIRESTORE_COLLECTION).doc(fbEncodeKey(key)).get();
          if (!snap.exists) throw new Error('key not found: ' + key);
          return { key, value: snap.data().value, shared: !!shared };
        },
        async set(key, value, shared){
          await db.collection(FIRESTORE_COLLECTION).doc(fbEncodeKey(key)).set({ value });
          return { key, value, shared: !!shared };
        },
        async delete(key, shared){
          await db.collection(FIRESTORE_COLLECTION).doc(fbEncodeKey(key)).delete();
          return { key, deleted: true, shared: !!shared };
        },
        async list(prefix, shared){
          const snap = await db.collection(FIRESTORE_COLLECTION).get();
          const keys = [];
          snap.forEach(doc => {
            const k = fbDecodeKey(doc.id);
            if (!prefix || k.startsWith(prefix)) keys.push({ key: k });
          });
          return { keys, prefix: prefix || '', shared: !!shared };
        }
      };
      return;
    } catch (e) {
      console.error('Firebase init failed, falling back', e);
    }
  }

  // 2) If running inside a Claude session that already provides window.storage, use it.
  if (window.storage && typeof window.storage.get === 'function') {
    storageBackend = 'native';
    return;
  }

  // 3) Fallback: localStorage. Works without errors, but is NOT shared across
  // devices/students — only visible on this one browser.
  storageBackend = 'local';
  const PREFIX = 'conjugaison_storage__';
  function fullKey(key){ return PREFIX + key; }
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem(fullKey(key));
      if (raw === null) throw new Error('key not found: ' + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem(fullKey(key), value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem(fullKey(key));
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const p = fullKey(prefix || '');
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith(p))
        .map(k => ({ key: k.slice(PREFIX.length) }));
      return { keys, prefix: prefix || '', shared: !!shared };
    }
  };
})();

// ===== BUNDLED FRENCH CONJUGATION ENGINE =====

// ============================================================
// FRENCH CONJUGATION ENGINE — REGULAR VERB RULES
// ============================================================

const P = ['je','tu','il','nous','vous','ils']; // il=il/elle/on, ils=ils/elles

function lastChar(s){ return s.slice(-1); }
function isNousVous(i){ return i===3||i===4; }

// ---- Regular -ER (with spelling-change subpatterns) ----
function erStem(inf, pattern, i){
  const r = inf.slice(0,-2); // remove "er"
  switch(pattern){
    case 'ger': // manger -> nous mangeons (keep soft g)
      return (i===3) ? r+'e' : r;
    case 'cer': // commencer -> nous commençons
      return (i===3) ? r.slice(0,-1)+'ç' : r;
    case 'e_er': // acheter -> j'achète: last vowel 'e' (2nd-to-last char of radical) becomes 'è'
      return isNousVous(i) ? r : r.slice(0,-2)+'è'+r.slice(-1);
    case 'ee_er': // préférer -> je préfère: same mutation, the é before final consonant becomes è
      return isNousVous(i) ? r : r.slice(0,-2)+'è'+r.slice(-1);
    case 'eler_dbl': // appeler -> j'appelle
      return isNousVous(i) ? r : r+lastChar(r);
    case 'eter_dbl': // jeter -> je jette
      return isNousVous(i) ? r : r+lastChar(r);
    case 'yer': // payer/employer/essuyer -> y->i except nous/vous
      return isNousVous(i) ? r : r.slice(0,-1)+'i';
    case 'ayer_opt': // payer also allows keeping y; we use the i-form (more standard taught form)
      return isNousVous(i) ? r : r.slice(0,-1)+'i';
    default:
      return r;
  }
}
// futur/conditionnel stem for -er verbs (infinitive minus nothing for -er, but é_er reverts to é in futur/cond)
function erFuturStem(inf, pattern){
  const r = inf.slice(0,-1); // "parler" -> "parler" minus final 'r'? No: futur stem = infinitive itself for -er/-ir
  return inf; // base infinitive used as futur/cond stem for -er and -ir verbs
}

const END = {
  presER: ['e','es','e','ons','ez','ent'],
  presIR: ['is','is','it','issons','issez','issent'],
  presRE: ['s','s','','ons','ez','ent'],
  imp: ['ais','ais','ait','ions','iez','aient'],
  fut: ['ai','as','a','ons','ez','ont'],
  cond: ['ais','ais','ait','ions','iez','aient'],
  psER: ['ai','as','a','âmes','âtes','èrent'],
  psIR: ['is','is','it','îmes','îtes','irent'],
  psU: ['us','us','ut','ûmes','ûtes','urent'],
  subjPres: ['e','es','e','ions','iez','ent'],
  subjImp: ['sse','sses',"^t",'ssions','ssiez','ssent'], // ^t = stem ends with circumflex+t, handled specially
  impv: ['','ons','ez'], // tu, nous, vous
};

function conjugateRegularER(inf, pattern, tense){
  const radical = inf.slice(0,-2);
  const out = [];
  for(let i=0;i<6;i++){
    let stem = erStem(inf, pattern, i);
    if(tense==='present') out.push(stem+END.presER[i]);
    else if(tense==='imparfait'){
      let impStem = (pattern==='ger' && i!==3 && i!==4) ? radical+'e' : (pattern==='cer' && i!==3 && i!==4) ? radical.slice(0,-1)+'ç' : radical;
      out.push(impStem+END.imp[i]);
    }
    else if(tense==='futur'){
      const futStem = (pattern==='e_er') ? radical.slice(0,-2)+'è'+lastChar(radical)+'er'
                     : (pattern==='eler_dbl') ? radical+lastChar(radical)+'er'
                     : (pattern==='eter_dbl') ? radical+lastChar(radical)+'er'
                     : inf;
      out.push(futStem+END.fut[i]);
    }
    else if(tense==='conditionnel'){
      const condStem = (pattern==='e_er') ? radical.slice(0,-2)+'è'+lastChar(radical)+'er'
                     : (pattern==='eler_dbl') ? radical+lastChar(radical)+'er'
                     : (pattern==='eter_dbl') ? radical+lastChar(radical)+'er'
                     : inf;
      out.push(condStem+END.cond[i]);
    }
    else if(tense==='subjPresent'){
      // subjunctive present uses same stem-change rule as indicative present (mostly), nous/vous like imparfait stem
      let sStem = isNousVous(i) ? radical : stem;
      out.push(sStem+END.subjPres[i]);
    }
  }
  return out;
}

function conjugateRegularIR(inf, tense){
  const radical = inf.slice(0,-2); // remove "ir"
  const out = [];
  for(let i=0;i<6;i++){
    if(tense==='present') out.push(radical+END.presIR[i]);
    else if(tense==='imparfait') out.push(radical+'iss'+END.imp[i]);
    else if(tense==='futur') out.push(inf+END.fut[i]);
    else if(tense==='conditionnel') out.push(inf+END.cond[i]);
    else if(tense==='passeSimple') out.push(radical+END.psIR[i]);
    else if(tense==='subjPresent') out.push(radical+'iss'+END.subjPres[i]);
  }
  return out;
}

function conjugateRegularRE(inf, tense){
  const radical = inf.slice(0,-2); // remove "re"
  const out = [];
  for(let i=0;i<6;i++){
    if(tense==='present') out.push(radical+END.presRE[i]);
    else if(tense==='imparfait') out.push(radical+END.imp[i]);
    else if(tense==='futur') out.push(inf.slice(0,-1)+END.fut[i]); // -re verbs: drop final 'e' -> vendr+ai
    else if(tense==='conditionnel') out.push(inf.slice(0,-1)+END.cond[i]);
    else if(tense==='passeSimple') out.push(radical+END.psIR[i]);
    else if(tense==='subjPresent') out.push(radical+END.subjPres[i]);
  }
  return out;
}



// ============================================================
// IRREGULAR VERB ARCHETYPES — explicit verified conjugations
// Each archetype defines stems per tense; derived verbs reuse pattern
// with their own prefix where applicable (e.g. revenir = re+venir)
// ============================================================

// Format: { present, imparfaitStem, futurStem, psStem (passé simple), pp (past participle), subjPresStem }
// imparfait always uses standard endings: ais,ais,ait,ions,iez,aient on imparfaitStem
// futur/cond always uses standard endings ai,as,a,ons,ez,ont / ais,ais,ait,ions,iez,aient on futurStem

const IRREGULAR = {
  etre: {
    present: ['suis','es','est','sommes','êtes','sont'],
    imparfaitStem: 'ét',
    futurStem: 'ser',
    ps: ['fus','fus','fut','fûmes','fûtes','furent'],
    pp: 'été',
    subjPres: ['sois','sois','soit','soyons','soyez','soient'],
    impv: ['sois','soyons','soyez'],
  },
  avoir: {
    present: ['ai','as','a','avons','avez','ont'],
    imparfaitStem: 'av',
    futurStem: 'aur',
    ps: ['eus','eus','eut','eûmes','eûtes','eurent'],
    pp: 'eu',
    subjPres: ['aie','aies','ait','ayons','ayez','aient'],
    impv: ['aie','ayons','ayez'],
  },
  aller: {
    present: ['vais','vas','va','allons','allez','vont'],
    imparfaitStem: 'all',
    futurStem: 'ir',
    ps: ['allai','allas','alla','allâmes','allâtes','allèrent'],
    pp: 'allé',
    subjPres: ['aille','ailles','aille','allions','alliez','aillent'],
    impv: ['va','allons','allez'],
    aux: 'etre',
  },
  faire: {
    present: ['fais','fais','fait','faisons','faites','font'],
    imparfaitStem: 'fais',
    futurStem: 'fer',
    ps: ['fis','fis','fit','fîmes','fîtes','firent'],
    pp: 'fait',
    subjPres: ['fasse','fasses','fasse','fassions','fassiez','fassent'],
    impv: ['fais','faisons','faites'],
  },
  pouvoir: {
    present: ['peux','peux','peut','pouvons','pouvez','peuvent'],
    imparfaitStem: 'pouv',
    futurStem: 'pourr',
    ps: ['pus','pus','put','pûmes','pûtes','purent'],
    pp: 'pu',
    subjPres: ['puisse','puisses','puisse','puissions','puissiez','puissent'],
    impv: null, // rarely used
  },
  vouloir: {
    present: ['veux','veux','veut','voulons','voulez','veulent'],
    imparfaitStem: 'voul',
    futurStem: 'voudr',
    ps: ['voulus','voulus','voulut','voulûmes','voulûtes','voulurent'],
    pp: 'voulu',
    subjPres: ['veuille','veuilles','veuille','voulions','vouliez','veuillent'],
    impv: ['veuille','veuillons','veuillez'],
  },
  devoir: {
    present: ['dois','dois','doit','devons','devez','doivent'],
    imparfaitStem: 'dev',
    futurStem: 'devr',
    ps: ['dus','dus','dut','dûmes','dûtes','durent'],
    pp: 'dû',
    subjPres: ['doive','doives','doive','devions','deviez','doivent'],
    impv: null,
  },
  savoir: {
    present: ['sais','sais','sait','savons','savez','savent'],
    imparfaitStem: 'sav',

// ============================================================
// MASTER CONJUGATOR — combines regular rules + irregular tables
// Handles reflexive pronoun logic and compound tenses
// ============================================================

const SUBJ = ['je','tu','il','nous','vous','ils'];
const REFL = ['me','te','se','nous','vous','se'];

function startsVowel(s){ return /^[aeiouhâàéèêëîïôöùûü]/i.test(s); }

// Build standard endings reused for irregular imparfait/futur/cond
const IMP_END = ['ais','ais','ait','ions','iez','aient'];
const FUT_END = ['ai','as','a','ons','ez','ont'];

function conjugateIrregular(verbEntry, tense){
  const arc = IRREGULAR[verbEntry.archetype];
  if(!arc) return null;
  const prefix = verbEntry.prefix || '';
  const out = [];
  for(let i=0;i<6;i++){
    let form;
    if(tense==='present') form = arc.present[i];
    else if(tense==='imparfait') form = arc.imparfaitStem===null?null:arc.imparfaitStem+IMP_END[i];
    else if(tense==='futur') form = arc.futurStem===null?null:arc.futurStem+FUT_END[i];
    else if(tense==='conditionnel') form = arc.futurStem===null?null:arc.futurStem+IMP_END[i];
    else if(tense==='passeSimple') form = arc.ps[i];
    else if(tense==='subjPresent') form = arc.subjPres[i];
    out.push(form===null||form===undefined ? null : prefix+form);
  }
  return out;
}

// Main entry: conjugate a verb entry for a given tense, returns array of 6 forms (or fewer if impersonal)
function conjugate(verbEntry, tense){
  let forms;
  if(verbEntry.group==='irregular'){
    forms = conjugateIrregular(verbEntry, tense);
  } else if(verbEntry.group==='er'){
    forms = conjugateRegularER(verbEntry.inf, verbEntry.pattern||'standard', tense);
  } else if(verbEntry.group==='ir'){
    forms = conjugateRegularIR(verbEntry.inf, tense);
  } else if(verbEntry.group==='re'){
    forms = conjugateRegularRE(verbEntry.inf, tense);
  }
  if(!forms) return null;

  // Apply reflexive pronouns if needed
  if(verbEntry.reflexive){
    forms = forms.map((f,i)=>{
      if(f===null) return null;
      const pron = REFL[i];
      if(pron==='me' && startsVowel(f)) return "m'"+f;
      if(pron==='te' && startsVowel(f)) return "t'"+f;
      if(pron==='se' && startsVowel(f)) return "s'"+f;
      return pron+' '+f;
    });
  }
  return forms;
}

// Build full subject+verb display string, e.g. "je parle" / "je m'appelle"
function fullForm(verbEntry, tense, personIndex, subjOverride){
  const forms = conjugate(verbEntry, tense);
  if(!forms || forms[personIndex]===null) return null;
  const subjLabels = ['je','tu','il','nous','vous','ils'];
  let subj = subjOverride !== undefined ? subjOverride : subjLabels[personIndex];
  let verbPart = forms[personIndex];
  if(personIndex===0 && !verbEntry.reflexive && startsVowel(verbPart)){
    return "j'"+verbPart;
  }
  return subj+' '+verbPart;
}

// PASSÉ COMPOSÉ — auxiliary + past participle, with agreement
// ============================================================

const AVOIR_PRES  = ['ai','as','a','avons','avez','ont'];
const ETRE_PRES   = ['suis','es','est','sommes','êtes','sont'];
const AVOIR_IMP   = ['avais','avais','avait','avions','aviez','avaient'];
const ETRE_IMP    = ['étais','étais','était','étions','étiez','étaient'];
const AVOIR_FUT   = ['aurai','auras','aura','aurons','aurez','auront'];
const ETRE_FUT    = ['serai','seras','sera','serons','serez','seront'];
const AVOIR_COND  = ['aurais','aurais','aurait','aurions','auriez','auraient'];
const ETRE_COND   = ['serais','serais','serait','serions','seriez','seraient'];
const AVOIR_SUBJ  = ['aie','aies','ait','ayons','ayez','aient'];
const ETRE_SUBJ   = ['sois','sois','soit','soyons','soyez','soient'];

// Regular past participles derived from infinitive
function regularPP(verbEntry){
  if(verbEntry.group==='er') return verbEntry.inf.slice(0,-2)+'é';
  if(verbEntry.group==='ir') return verbEntry.inf.slice(0,-2)+'i';
  if(verbEntry.group==='re') return verbEntry.inf.slice(0,-2)+'u'; // most regular -re verbs: vendu, attendu, perdu, répondu
  return null;
}

function getPastParticiple(verbEntry){
  if(verbEntry.group==='irregular'){
    const arc = IRREGULAR[verbEntry.archetype];
    const prefix = verbEntry.prefix || '';
    return arc ? prefix+arc.pp : null;
  }
  return regularPP(verbEntry);
}

// Agreement suffix for être verbs (or reflexive with direct object agreement - simplified to standard subject agreement)
// i: 0=je,1=tu,2=il,3=nous,4=vous,5=ils — gender unknown by default, so we offer masculine singular/plural as default
// teaching tool: show agreement note rather than forcing a specific gender
function ppAgreement(pp, personIndex, gender){
  // gender: 'm' or 'f', default 'm'
  let suffix = '';
  const isPlural = (personIndex===3 || personIndex===5); // nous/ils treated as plural; vous ambiguous-> treat singular by default
  if(gender==='f') suffix += 'e';
  if(isPlural) suffix += 's';
  return pp+suffix;
}

// Generic compound tense builder: auxArray (avoir or être conjugated in some tense) + pp
function buildCompound(verbEntry, personIndex, gender, avoirArr, etreArr){
  gender = gender || 'm';
  const pp = getPastParticiple(verbEntry);
  if(!pp) return null;
  const usesEtre = verbEntry.aux==='etre' || verbEntry.reflexive;
  const auxForm = usesEtre ? etreArr[personIndex] : avoirArr[personIndex];

  if(verbEntry.reflexive){
    const REFL = ['me','te','se','nous','vous','se'];
    const pron = REFL[personIndex];
    const pronPart = /^[aeiouhâàéèêëîïôöùûü]/i.test(auxForm) && (pron==='me'||pron==='te'||pron==='se')
      ? pron.charAt(0)+"'" : pron+' ';
    return pronPart+auxForm+' '+ppAgreement(pp, personIndex, gender);
  }
  const agreedPP = usesEtre ? ppAgreement(pp, personIndex, gender) : pp;
  return auxForm+' '+agreedPP;
}

// Passé composé: auxiliary in présent
function passeCompose(verbEntry, personIndex, gender){
  return buildCompound(verbEntry, personIndex, gender, AVOIR_PRES, ETRE_PRES);
}
// Plus-que-parfait: auxiliary in imparfait
function plusQueParfait(verbEntry, personIndex, gender){
  return buildCompound(verbEntry, personIndex, gender, AVOIR_IMP, ETRE_IMP);
}
// Futur antérieur: auxiliary in futur
function futurAnterieur(verbEntry, personIndex, gender){
  return buildCompound(verbEntry, personIndex, gender, AVOIR_FUT, ETRE_FUT);
}
// Conditionnel passé: auxiliary in conditionnel
function conditionnelPasse(verbEntry, personIndex, gender){
  return buildCompound(verbEntry, personIndex, gender, AVOIR_COND, ETRE_COND);
}
// Subjonctif passé: auxiliary in subjonctif présent
function subjonctifPasse(verbEntry, personIndex, gender){
  return buildCompound(verbEntry, personIndex, gender, AVOIR_SUBJ, ETRE_SUBJ);
}

// Impératif présent: only tu(0)/nous(1)/vous(2) — maps to personIndex 1,3,4 in normal scheme
// We expose imperatifIdx: 0=tu, 1=nous, 2=vous
function imperatif(verbEntry, imperatifIdx){
  if(verbEntry.group==='irregular'){
    const arc = IRREGULAR[verbEntry.archetype];
    if(!arc || !arc.impv) return null;
    if(arc.impv[imperatifIdx]===null) return null;
    const prefix = verbEntry.prefix || '';
    return prefix + arc.impv[imperatifIdx];
  }
  if(verbEntry.group==='er'){
    // regular -er: tu=parle(no s), nous=parlons, vous=parlez
    const radical = verbEntry.inf.slice(0,-2);
    const ends = ['e','ons','ez'];
    // spelling changes for nous/vous only for ger/cer
    if(verbEntry.pattern==='ger' && imperatifIdx===1) return radical+'e'+'ons';
    if(verbEntry.pattern==='cer' && imperatifIdx===1) return radical.slice(0,-1)+'ç'+'ons';
    return radical + ends[imperatifIdx];
  }
  if(verbEntry.group==='ir'){
    const radical = verbEntry.inf.slice(0,-2);
    const ends = ['is','issons','issez'];
    return radical + ends[imperatifIdx];
  }
  if(verbEntry.group==='re'){
    const radical = verbEntry.inf.slice(0,-2);
    const ends = ['s','ons','ez'];
    return radical + ends[imperatifIdx];
  }
  return null;
}

function fullPasseCompose(verbEntry, personIndex, gender, subjOverride){
  const subjLabels = ['je','tu','il','nous','vous','ils'];
  const form = passeCompose(verbEntry, personIndex, gender);
  if(!form) return null;
  const subj = subjOverride !== undefined ? subjOverride : subjLabels[personIndex];
  const startsVowel = /^[aeiouhâàéèêëîïôöùûü]/i.test(form);
  if(personIndex===0 && !verbEntry.reflexive && startsVowel){
    return "j'"+form;
  }
  if(!subj) return form; // no subject prefix (reflexive display handled separately)
  return subj+' '+form;
}

// 9 distinct quiz targets
// Index: 0=je, 1=tu, 2=il, 3=elle, 4=on, 5=nous, 6=vous, 7=ils, 8=elles
// Maps to conjugation person index (0-5):
const TARGET_TO_PERSON = [0,1,2,2,2,3,4,5,5];
// Gender: il/ils=m, elle/elles=f, on=m (on takes masculine agreement by default)
// je/tu/nous/vous = ambiguous (null) for être verbs
const TARGET_GENDER    = [null,null,'m','f','m',null,null,'m','f'];
const TARGET_LABELS    = ['je','tu','il','elle','on','nous','vous','ils','elles'];
const PRONOUN_DISPLAY  = ['je','tu','il','elle','on','nous','vous','ils','elles'];
const SUBJ_DISPLAY     = ['je','tu','il','elle','on','nous','vous','ils','elles'];

// Whether a tense + aux combo requires agreement checking
function needsAgreement(verb, tense) {
  if (tense === 'passeCompose') return verb.aux === 'etre' || verb.reflexive;
  return false;
}

// Build the correct answer for a given target (0-7)
function getAnswer(verb, tense, targetIdx) {
  const personIdx = TARGET_TO_PERSON[targetIdx];
  const gender = TARGET_GENDER[targetIdx]; // null = ambiguous

  const subjLabel = SUBJ_DISPLAY[targetIdx];

  // ---- Impératif: tu/nous/vous only ----
  if (tense === 'imperatif') {
    const imperatifMap = {1:0, 5:1, 6:2};
    const impIdx = imperatifMap[targetIdx];
    if (impIdx === undefined) return null;
    const form = imperatif(verb, impIdx);
    if (!form) return null;
    return { main: form, alt: null, ambiguous: false, subjLabel: '' };
  }

  // ---- Compound tenses ----
  const compoundFns = { passeCompose, plusQueParfait, futurAnterieur, conditionnelPasse, subjonctifPasse };
  if (compoundFns[tense]) {
    const fn = compoundFns[tense];
    const needsAgr = verb.aux === 'etre' || verb.reflexive;
    if (gender === null && needsAgr) {
      const mForm = fn(verb, personIdx, 'm');
      const fForm = fn(verb, personIdx, 'f');
      if (!mForm) return null;
      return { main: mForm, alt: fForm, ambiguous: true, subjLabel };
    }
    const g = gender || 'm';
    const form = fn(verb, personIdx, g);
    if (!form) return null;
    return { main: form, alt: null, ambiguous: false, subjLabel };
  }

  // ---- Simple tenses ----
  const forms = conjugate(verb, tense);
  if (!forms) return null;
  const form = forms[personIdx];
  if (form === null || form === undefined) return null;
  return { main: form, alt: null, ambiguous: false, subjLabel };
}

// Build the subject pronoun prefix for display
function buildSubjectPrefix(verb, tense, targetIdx) {
  const label = SUBJ_DISPLAY[targetIdx];
  const personIdx = TARGET_TO_PERSON[targetIdx];
  // For reflexive verbs in passé composé, the reflexive pronoun is already
  // baked into the form returned by passeCompose(), so no extra subject prefix
  if (verb.reflexive && tense === 'passeCompose') {
    return label; // show "je", "tu", etc. as the prompt pronoun
  }
  return label;
}

let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(ctx, freq, start, dur, type, peak){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(peak == null ? 0.18 : peak, start + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.03);
}
function sweep(ctx, f1, f2, start, dur, type, peak){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(f1, start);
  osc.frequency.exponentialRampToValueAtTime(f2, start + dur);
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(peak == null ? 0.18 : peak, start + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.03);
}

function baseVerbEnglish(meaning){
  let m = (meaning || '').split(',')[0].trim();
  if (m.toLowerCase().startsWith('to ')) m = m.slice(3);
  return m.trim().toLowerCase();
}
function thirdPersonSEN(v){
  const irr = IRREGULAR_EN[v];
  if (irr && irr.s) return irr.s;
  if (v === 'have') return 'has';
  if (/(?:s|sh|ch|x|z|o)$/.test(v)) return v + 'es';
  if (/[^aeiou]y$/.test(v)) return v.slice(0, -1) + 'ies';
  return v + 's';
}
function pastTenseEN(v){
  const irr = IRREGULAR_EN[v];
  if (irr) return irr.past;
  if (/e$/.test(v)) return v + 'd';
  if (/[^aeiou]y$/.test(v)) return v.slice(0, -1) + 'ied';
  return v + 'ed';
}
function pastParticipleEN(v){
  const irr = IRREGULAR_EN[v];
  if (irr) return irr.pp;
  return pastTenseEN(v);
}
function gerundEN(v){
  if (v === 'be') return 'being';
  if (/ie$/.test(v)) return v.slice(0, -2) + 'ying';
  if (/[^e]e$/.test(v)) return v.slice(0, -1) + 'ing';
  return v + 'ing';
}
function presentEN(v, targetIdx){
  const heShe = (targetIdx === 2 || targetIdx === 3 || targetIdx === 4); // il / elle / on
  if (v === 'be') return heShe ? 'is' : (targetIdx === 0 ? 'am' : 'are');
  return heShe ? thirdPersonSEN(v) : v;
}
// Builds a short English translation for the pronoun + mood/tense that was just answered.
function translateAnswer(verb, mood, tense, targetIdx){
  try {
    const base = baseVerbEnglish(verb.meaning);
    if (!base) return null;
    const p = PRONOUN_EN[targetIdx];
    const pLower = p.toLowerCase();
    switch (mood + '.' + tense) {
      case 'indicatif.present': return p + ' ' + presentEN(base, targetIdx);
      case 'indicatif.imparfait': {
        const aux = (targetIdx === 1 || targetIdx === 5 || targetIdx === 6 || targetIdx === 7 || targetIdx === 8) ? 'were' : 'was';
        return p + ' ' + aux + ' ' + gerundEN(base);
      }
      case 'indicatif.passeCompose': return p + ' ' + pastTenseEN(base);
      case 'indicatif.plusQueParfait': return p + ' had ' + pastParticipleEN(base);
      case 'indicatif.futur': return p + ' will ' + base;
      case 'indicatif.futurAnterieur': return p + ' will have ' + pastParticipleEN(base);
      case 'indicatif.passeSimple': return p + ' ' + pastTenseEN(base) + ' (littéraire)';
      case 'conditionnel.conditionnel': return p + ' would ' + base;
      case 'conditionnel.conditionnelPasse': return p + ' would have ' + pastParticipleEN(base);
      case 'subjonctif.subjPresent': return 'that ' + pLower + ' ' + base;
      case 'subjonctif.subjonctifPasse': return 'that ' + pLower + ' have ' + pastParticipleEN(base);
      case 'imperatif.imperatif': return base.charAt(0).toUpperCase() + base.slice(1) + '!';
      default: return p + ' ' + base;
    }
  } catch (e) {
    return null;
  }
}

let currentMood = 'indicatif';
let currentTense = 'present';
let currentVerb = null;
let currentTargetIdx = 0;
let streak = 0;
let bestStreakSession = 0;
let totalAttempts = 0;
let totalCorrect = 0;
let questionStartTime = null;
let answered = false;
let currentAnswer = null; // { main, alt, ambiguous }

function pickRandomVerb() {
  return VERBS[Math.floor(Math.random() * VERBS.length)];
}
function pickRandomTarget() {
  return Math.floor(Math.random() * 9);
}

function newQuestion() {
  answered = false;
  let verb, targetIdx, answer;
  let tries = 0;
  do {
    verb = pickRandomVerb();
    targetIdx = pickRandomTarget();
    answer = getAnswer(verb, currentTense, targetIdx);
    tries++;
  } while ((!answer || answer.main === null || answer.main === undefined) && tries < 40);

  if (!answer || answer.main === null) return;

  currentVerb = verb;
  currentTargetIdx = targetIdx;
  currentAnswer = answer;

  const displayInf = verb.displayInf || verb.inf;
  document.getElementById('verbDisplay').textContent = displayInf;
  document.getElementById('verbMeaning').textContent = verb.meaning;

  // Show the pronoun prompt
  const pronounLabel = PRONOUN_DISPLAY[targetIdx];
  document.getElementById('pronounDisplay').textContent = pronounLabel;

  // Tense/mood label
  const moodLabel = MOODS[currentMood] ? MOODS[currentMood].label : '';
  const tenseLabel = MOODS[currentMood] ? (MOODS[currentMood].tenses[currentTense] || currentTense) : currentTense;
  document.getElementById('moodTenseLabel').textContent = moodLabel + ' · ' + tenseLabel;

  // Hint display
  let hint = '';
  if (answer.ambiguous) hint = '(masculin ou féminin accepté)';
  else if (currentTense === 'imperatif') hint = '(impératif — pas de sujet)';
  document.getElementById('pcHint').textContent = hint;

  // For imperatif, grey out the pronoun display (no subject used)
  const pronounEl = document.getElementById('pronounDisplay');
  if (currentTense === 'imperatif') {
    pronounEl.style.opacity = '0.35';
    pronounEl.style.textDecoration = 'line-through';
  } else {
    pronounEl.style.opacity = '1';
    pronounEl.style.textDecoration = 'none';
  }

  const input = document.getElementById('answerInput');
  input.value = '';
  input.classList.remove('correct', 'wrong');
  input.disabled = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  input.focus();
  questionStartTime = Date.now();
}

function normalize(s) {
  return (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function checkAnswer() {
  if (answered) return;
  const input = document.getElementById('answerInput');
  const userAns = normalize(input.value);
  const mainAns = normalize(currentAnswer.main);
  const altAns  = currentAnswer.alt ? normalize(currentAnswer.alt) : null;
  const elapsed = (Date.now() - questionStartTime) / 1000;
  const isCorrect = (userAns === mainAns) || (altAns && userAns === altAns);

  answered = true;
  totalAttempts++;
  const feedback = document.getElementById('feedback');

  function buildDisplay(s, form) {
    if (!s) return form;
    if (s === 'je' && /^[aeiouhâàéèêëîïôöùûü]/i.test(form)) return "j'" + form;
    return s + ' ' + form;
  }
  const translation = translateAnswer(currentVerb, currentMood, currentTense, currentTargetIdx);

  if (isCorrect) {
    streak++;
    totalCorrect++;
    input.classList.add('correct');
    playCorrectSound();
    feedback.textContent = '✓ Correct !  (' + elapsed.toFixed(1) + 's)' + (translation ? '  →  "' + translation + '"' : '');
    feedback.className = 'feedback correct';
    if (streak > bestStreakSession) bestStreakSession = streak;
    updateStats();
    saveProgressIfNamed(elapsed);
    setTimeout(newQuestion, 1100);
  } else {
    streak = 0;
    input.classList.add('wrong');
    playWrongSound();
    const subj = currentAnswer.subjLabel || '';
    let correction = buildDisplay(subj, currentAnswer.main);
    if (currentAnswer.ambiguous) correction += ' / ' + buildDisplay(subj, currentAnswer.alt);
    feedback.textContent = '✗ La bonne réponse : ' + correction + (translation ? '  →  "' + translation + '"' : '');
    feedback.className = 'feedback wrong';
    updateStats();
    saveProgressIfNamed(elapsed);
    input.disabled = true;
  }
}

function updateStats() {
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statBest').textContent = bestStreakSession;
  const acc = totalAttempts > 0 ? Math.round(100 * totalCorrect / totalAttempts) : null;
  document.getElementById('statAccuracy').textContent = acc === null ? '—' : acc + '%';
}

// ===== Storage-backed live leaderboard =====
function getPlayerName() {
  return (document.getElementById('playerName').value || '').trim();
}

function computeScore(bestStreak, accuracyPct, avgTime) {
  const speedBonus = Math.max(0, 10 - Math.min(avgTime, 10));
  return Math.round(bestStreak * 10 * (accuracyPct / 100) + speedBonus * 5);
}

let questionTimes = [];

async function saveProgressIfNamed(lastElapsed) {
  const name = getPlayerName();
  if (!name) return;
  questionTimes.push(lastElapsed);
  if (questionTimes.length > 30) questionTimes.shift();
  const avgTime = questionTimes.reduce((a, b) => a + b, 0) / questionTimes.length;
  const accuracyPct = totalAttempts > 0 ? (100 * totalCorrect / totalAttempts) : 0;
  const score = computeScore(bestStreakSession, accuracyPct, avgTime);

  try {
    let best = null;
    try { const ex = await window.storage.get('lb:' + name, true); if (ex) best = JSON.parse(ex.value); } catch(e) {}
    if (!best || score > best.score) {
      const record = { name, score, bestStreak: bestStreakSession, accuracy: Math.round(accuracyPct), avgTime: Math.round(avgTime * 10) / 10, updatedAt: Date.now() };
      await window.storage.set('lb:' + name, JSON.stringify(record), true);
    }
  } catch (e) { console.error('Storage write error', e); }
  refreshLeaderboard();
}

async function refreshLeaderboard() {
  const listEl = document.getElementById('leaderboardList');
  try {
    const keys = await window.storage.list('lb:', true);
    if (!keys || !keys.keys || keys.keys.length === 0) {
      listEl.innerHTML = '<div class="empty-lb">Aucun score pour l\'instant — soyez le premier !</div>';
      return;
    }
    const records = [];
    for (const k of keys.keys) {
      try { const r = await window.storage.get(k.key || k, true); if (r) records.push(JSON.parse(r.value)); } catch(e) {}
    }
    records.sort((a, b) => b.score - a.score);
    const top = records.slice(0, 10);
    listEl.innerHTML = top.map((r, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
      return '<div class="lb-row"><div class="lb-rank">' + medal + '</div><div class="lb-name">' + escapeHtml(r.name) + '<div class="lb-meta">série ' + r.bestStreak + ' · ' + r.accuracy + '% · ' + r.avgTime + 's/q</div></div><div class="lb-score">' + r.score + '</div></div>';
    }).join('');
  } catch (e) {
    console.error('Leaderboard refresh error', e);
    listEl.innerHTML = '<div class="empty-lb">Connexion au classement...</div>';
    setTimeout(refreshLeaderboard, 2000);
  }
}

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ===== Mood / tense selector UI =====
function renderMoodSelector() {
  const el = document.getElementById('moodSelector');
  el.innerHTML = Object.keys(MOODS).map(m =>
    '<button class="sel-btn' + (m === currentMood ? ' active' : '') + '" data-mood="' + m + '">' + MOODS[m].label + '</button>'
  ).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      currentMood = btn.dataset.mood;
      currentTense = Object.keys(MOODS[currentMood].tenses)[0];
      renderMoodSelector();
      renderTenseSelector();
      newQuestion();
    };
  });
}

function renderTenseSelector() {
  const el = document.getElementById('tenseSelector');
  const tenses = MOODS[currentMood].tenses;
  el.innerHTML = Object.keys(tenses).map(t =>
    '<button class="sel-btn' + (t === currentTense ? ' active' : '') + '" data-tense="' + t + '">' + tenses[t] + '</button>'
  ).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      currentTense = btn.dataset.tense;
      renderTenseSelector();
      newQuestion();
    };
  });
}

document.getElementById('checkBtn').onclick = checkAnswer;
document.getElementById('skipBtn').onclick = () => { streak = 0; updateStats(); newQuestion(); };
document.getElementById('answerInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { if (answered) { newQuestion(); } else { checkAnswer(); } }
});
document.getElementById('playerName').addEventListener('change', refreshLeaderboard);

// ===== Name-first gating: the student must enter a name before the verb tabs / game appear =====
let gameStarted = false;
function startGame(){
  const name = getPlayerName();
  const gateMsg = document.getElementById('gateMsg');
  if (!name) {
    gateMsg.textContent = '⚠️ Merci d\'entrer votre nom avant de commencer.';
    gateMsg.style.color = 'var(--coral-light)';
    document.getElementById('playerName').focus();
    return;
  }
  gateMsg.style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';
  if (!gameStarted) {
    gameStarted = true;
    newQuestion();
  }
}
document.getElementById('startBtn').onclick = startGame;
document.getElementById('playerName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); startGame(); }
});

renderMoodSelector();
renderTenseSelector();
updateStats();
// The live leaderboard is always shown and refreshed, even before the student starts playing.
const lbStatusEl = document.getElementById('lbStatus');
if (storageBackend === 'firebase') {
  lbStatusEl.textContent = '🟢 en ligne — partagé entre tous les appareils';
} else if (storageBackend === 'native') {
  lbStatusEl.textContent = '🟢 en ligne — partagé';
} else {
  lbStatusEl.textContent = '🟡 local à cet appareil (configuration Firebase requise)';
  lbStatusEl.style.color = 'var(--gold)';
}
refreshLeaderboard();
setInterval(refreshLeaderboard, 15000);

</script>
